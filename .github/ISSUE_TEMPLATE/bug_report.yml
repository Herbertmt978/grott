name: Bug report
description: Report a runtime, parsing, Docker, or Home Assistant problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing this fork. Please remove passwords, API keys, public IPs, and anything else private before posting logs.
  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      options:
        - Home Assistant add-on
        - Docker Compose
        - Docker run
        - Python/manual
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grott version or image tag
      placeholder: 0.1.5-beta
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter and datalogger model
      placeholder: SPH5000 + ShineWiFi-X
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected, what actually happened, and when it started.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste only the Grott options needed to reproduce the issue. Do not include secrets.
      render: ini
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include Grott logs around startup and around the bad packet or MQTT publish.
      render: text
  - type: textarea
    id: checks
    attributes:
      label: Checks already tried
      placeholder: Restarted Grott, cleared retained discovery topics, compared with ShinePhone...
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed MQTT passwords, API keys, public IPs, and other private values.
          required: true
