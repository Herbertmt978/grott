name: Home Assistant add-on install
description: Report install, startup, or MQTT discovery problems with the add-on.
title: "[HA add-on]: "
labels:
  - home-assistant
  - install
body:
  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      placeholder: Copy the exact version shown on the add-on Info tab
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: Copy the exact version shown in Settings > About
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - aarch64
        - amd64
        - armv7
        - i386
        - other
  - type: textarea
    id: options
    attributes:
      label: Add-on options
      description: Paste options only. Do not include MQTT passwords.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Add-on log
      description: Include startup through the first packet attempt if possible.
      render: text
    validations:
      required: true
  - type: textarea
    id: mqtt
    attributes:
      label: MQTT details
      description: Broker type, whether auth is enabled, and whether other MQTT devices are working.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed MQTT passwords and other private values.
          required: true
