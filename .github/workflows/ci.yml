name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Audit locked runtime dependencies
        run: pip-audit --require-hashes -r requirements.lock

      - name: Validate Home Assistant add-on repository
        run: python tools/validate_ha_addon_repo.py

      - name: Validate release invariants
        run: python tools/validate_release.py --check-worktree

      - name: Run high-signal Ruff checks
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile maintained Python sources
        run: python -m compileall -q grott*.py grottext tools "examples/Home Assistent/grott_ha.py"

      - name: Run tests
        run: pytest tests "examples/Home Assistent/test_grott_ha.py" -q

      - name: Set up QEMU for container builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Build native Docker runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            BUILD_VERSION=ci
            VCS_REF=${{ github.sha }}
          tags: grott-ci-runtime:ci
          cache-from: type=gha,scope=grott-runtime
          cache-to: type=gha,scope=grott-runtime,mode=max

      - name: Build native Home Assistant add-on image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: addons/grott/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            BUILD_VERSION=ci
            VCS_REF=${{ github.sha }}
          tags: grott-ci-addon:ci
          cache-from: type=gha,scope=grott-addon
          cache-to: type=gha,scope=grott-addon,mode=max

      - name: Smoke test native container images
        shell: bash
        run: |
          set -euo pipefail
          runtime_stdout="${RUNNER_TEMP}/grott-ci-runtime.stdout"
          runtime_stderr="${RUNNER_TEMP}/grott-ci-runtime.stderr"
          addon_stdout="${RUNNER_TEMP}/grott-ci-addon.stdout"
          addon_stderr="${RUNNER_TEMP}/grott-ci-addon.stderr"
          runtime_run_pid=""
          addon_run_pid=""
          cleanup() {
            local status=$?
            set +e
            docker rm -f grott-ci-runtime grott-ci-addon >/dev/null 2>&1 || true
            if [[ -n "${runtime_run_pid}" ]]; then
              wait "${runtime_run_pid}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${addon_run_pid}" ]]; then
              wait "${addon_run_pid}" >/dev/null 2>&1 || true
            fi
            docker volume rm grott-ci-data >/dev/null 2>&1 || true
            if [[ "${status}" -eq 0 ]]; then
              set -e
            fi
            return "${status}"
          }
          wait_for_healthy() {
            local container="$1"
            local stdout_file="$2"
            local stderr_file="$3"
            local run_pid="$4"
            local state=""
            local health=""
            local inspection=""
            for _attempt in $(seq 1 30); do
              if ! inspection="$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "${container}" 2>/dev/null)"; then
                if ! kill -0 "${run_pid}" 2>/dev/null; then
                  wait "${run_pid}" || true
                  echo "ERROR: attached docker run for ${container} exited before container creation" >&2
                  test ! -s "${stderr_file}" || cat "${stderr_file}" >&2
                  return 1
                fi
                sleep 1
                continue
              fi
              read -r state health <<< "${inspection}"
              if [[ "${health}" == "healthy" ]]; then
                return 0
              fi
              if [[ "${health}" == "unhealthy" || "${state}" == "exited" || "${state}" == "dead" ]]; then
                echo "ERROR: ${container} entered state=${state} health=${health}" >&2
                tail -n 200 "${stdout_file}" || true
                test ! -s "${stderr_file}" || cat "${stderr_file}" >&2
                return 1
              fi
              sleep 1
            done
            tail -n 200 "${stdout_file}" || true
            test ! -s "${stderr_file}" || cat "${stderr_file}" >&2
            echo "ERROR: ${container} did not become healthy (state=${state} health=${health})" >&2
            return 1
          }
          trap cleanup EXIT
          cleanup
          : > "${runtime_stdout}"
          : > "${runtime_stderr}"
          : > "${addon_stdout}"
          : > "${addon_stderr}"

          docker run --name grott-ci-runtime \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env gnomqtt=True \
            grott-ci-runtime:ci > "${runtime_stdout}" 2> "${runtime_stderr}" &
          runtime_run_pid=$!

          docker volume create grott-ci-data >/dev/null
          docker run --rm --entrypoint python --volume grott-ci-data:/data grott-ci-addon:ci \
            -c 'import json; from pathlib import Path; path = Path("/data/options.json"); path.write_text(json.dumps({"ha_plugin": False}), encoding="utf-8"); path.chmod(0o600)'
          options_mode="$(docker run --rm --entrypoint stat --volume grott-ci-data:/data grott-ci-addon:ci -c '%u:%g %a' /data/options.json)"
          test "${options_mode}" = "0:0 600"
          docker run --name grott-ci-addon \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --env gnomqtt=True \
            --volume grott-ci-data:/data:ro \
            grott-ci-addon:ci > "${addon_stdout}" 2> "${addon_stderr}" &
          addon_run_pid=$!

          wait_for_healthy grott-ci-runtime "${runtime_stdout}" "${runtime_stderr}" "${runtime_run_pid}"
          wait_for_healthy grott-ci-addon "${addon_stdout}" "${addon_stderr}" "${addon_run_pid}"
          test ! -s "${runtime_stderr}"
          test ! -s "${addon_stderr}"
          for container in grott-ci-runtime grott-ci-addon; do
            test "$(docker exec "${container}" awk '/^Uid:/{print $2}' /proc/1/status)" = "10001"
            test "$(docker exec "${container}" awk '/^Gid:/{print $2}' /proc/1/status)" = "10001"
            test "$(docker exec "${container}" awk '/^CapEff:/{print $2}' /proc/1/status)" = "0000000000000000"
          done
          test "$(docker inspect --format '{{.Config.User}}' grott-ci-runtime)" = "10001:10001"

      - name: Validate native runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          for image in grott-ci-runtime:ci grott-ci-addon:ci; do
            docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges:true --user 10001:10001 \
              --entrypoint python "${image}" /usr/local/bin/validate_container_artifact.py
          done

      - name: Scan native images for vulnerabilities and secrets
        shell: bash
        run: |
          set -euo pipefail
          for image in grott-ci-runtime:ci grott-ci-addon:ci; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume grott-trivy-cache:/root/.cache/ \
              aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --scanners vuln,secret --severity HIGH,CRITICAL \
              --exit-code 1 --no-progress "${image}"
          done

      - name: Build Docker runtime image for every supported platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: false
          build-args: |
            BUILD_VERSION=ci
            VCS_REF=${{ github.sha }}
          tags: grott:test
          cache-from: type=gha,scope=grott-runtime

      - name: Build Home Assistant add-on image for every supported platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: addons/grott/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: false
          build-args: |
            BUILD_VERSION=ci
            VCS_REF=${{ github.sha }}
          tags: grott-ha-docker:test
          cache-from: type=gha,scope=grott-addon
