name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate Home Assistant add-on repository
        run: python tools/validate_ha_addon_repo.py

      - name: Run tests
        run: pytest tests "examples/Home Assistent/test_grott_ha.py" -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dockerfile
          push: false
          tags: grott:test

      - name: Build Docker runtime image for i386
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dockerfile
          platforms: linux/386
          push: false
          tags: grott:i386-test
